<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>던전 오브 소울 · 이미지 목록</title><style>body{margin:0;background:#0d1526;color:#eee;font:16px system-ui;padding:32px}h1{color:#f5d891}input,select{padding:12px;background:#17223c;color:white;border:1px solid #d9a441;margin-right:10px;border-radius:6px}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:24px}article{padding:12px;border:1px solid #33415d;border-radius:12px;overflow:hidden}img{width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#263044 0% 25%,#354159 0% 50%) 0/24px 24px}a{color:#f5d891;text-decoration:none}small{display:block;color:#aebad0}p{max-width:850px;line-height:1.7}</style><h1>던전 오브 소울 · 제작 이미지</h1><p>선택 항목을 포함한 이미지 원본 목록입니다. 이미지를 누르면 원본을 엽니다. 실제 크기는 각 항목에 표시됩니다. 캐릭터 시트는 게임 적용 전에 프레임 분할·발 위치 정렬 확인이 필요합니다.</p><input id="search" placeholder="파일명 검색"><select id="filter"><option value="">전체</option><option value="player">캐릭터</option><option value="floor">바닥</option><option value="wall">벽</option><option value="decal">장식</option><option value="ui">UI</option><option value="background">배경</option><option value="icon">아이콘</option></select><span id="count"></span><main id="grid"></main><script src="catalog_data.js"></script><script>function render(){const q=document.querySelector('#search').value.toLowerCase(),f=document.querySelector('#filter').value;const rows=ASSETS.filter(x=>x.name.includes(q)&&(!f||(f==='player'?/^(warrior|mage|rogue|cleric)_/.test(x.name):x.name.startsWith(f+'_'))));document.querySelector('#count').textContent=rows.length+'장';document.querySelector('#grid').innerHTML=rows.map(x=>'<article><a href="'+x.name+'" target="_blank"><img loading="lazy" src="'+x.name+'" alt="'+x.name+'"><p>'+x.name+'</p></a><small>'+x.width+' × '+x.height+' px</small></article>').join('')}document.querySelector('#search').oninput=render;document.querySelector('#filter').onchange=render;render();</script></html>
