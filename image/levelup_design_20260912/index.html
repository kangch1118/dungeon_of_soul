<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레벨업 카드 디자인</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1220;color:#e9e2d6;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:48px 24px}h1{font-size:28px}p{color:#b3bed0;line-height:1.7}.cards{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;margin:40px 0}.card{position:relative;width:280px;aspect-ratio:2/3;background:url(card_ornate_gold.png) center/100% 100%;border:0;color:#eee;cursor:pointer;transition:transform .25s,filter .25s;padding:80px 38px 48px;display:flex;align-items:center;flex-direction:column}.card:hover,.card:focus-visible{transform:translateY(-8px);filter:brightness(1.13);outline:2px solid #f4d688;outline-offset:5px}.icon{width:115px;height:115px;object-fit:contain;position:relative;z-index:1}.halo{position:absolute;top:61px;width:152px;height:152px;opacity:.48;animation:turn 35s linear infinite}.card h2{font-size:21px;margin:20px 0 8px;color:#ffdc8f}.card p{font-size:14px;margin:0;min-height:62px}.tag{font-size:11px;color:#d5b875;margin-top:auto;letter-spacing:2px}.burst{position:absolute;inset:0;margin:auto;width:100%;pointer-events:none;opacity:0}.selected .burst{animation:flash .7s ease-out}.effects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}.effects figure{margin:0;padding:20px;background:#141e30;border-radius:16px}.effects img{width:100%;max-height:260px;object-fit:contain}figcaption{margin-top:16px;color:#c9b788}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flash{0%{opacity:0;transform:scale(.4)}20%{opacity:1}100%{opacity:0;transform:scale(1.5)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.selected{outline:2px solid gold}}</style>
<main><h1>레벨업 카드 · 황금 문양</h1><p>카드를 눌러 선택 섬광을 확인하세요. 실제 게임 적용 전 디자인 미리보기입니다.<br>카드의 이름·설명은 이미지와 분리되어 있습니다.</p><section class="cards" id="cards"></section><h2>분리된 이펙트 원본</h2><section class="effects"><figure><img src="fx_levelup_halo.png" alt="금빛 레벨업 후광"><figcaption>레벨업 후광 · 아이콘 뒤 장식</figcaption></figure><figure><img src="fx_card_select.png" alt="카드 선택 섬광"><figcaption>선택 섬광 · 확대하며 사라지는 연출</figcaption></figure></section></main>
<script>const samples=[['atk','검격 강화','공격력이 20% 증가합니다.'],['aspd','신속','공격속도가 15% 증가합니다.'],['hp','활력','최대 체력이 25 증가하고 즉시 모두 회복합니다.']];for(const[id,name,desc]of samples){const b=document.createElement('button');b.className='card';b.innerHTML=`<img class="halo" src="fx_levelup_halo.png" alt=""><img class="icon" src="icon_${id}.png" alt=""><h2>${name}</h2><p>${desc}</p><span class="tag">패시브</span><img class="burst" src="fx_card_select.png" alt="">`;b.onclick=()=>{b.classList.remove('selected');void b.offsetWidth;b.classList.add('selected')};document.querySelector('#cards').append(b)}</script></html>
