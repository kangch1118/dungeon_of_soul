<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전투 이펙트 미리보기</title>
<style>body{margin:0;padding:32px;background:#0d1526;color:#eef2fb;font:16px system-ui}h1{color:#f5d891}p{line-height:1.7}main,section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}article{padding:16px;border:1px solid #354159;border-radius:12px;overflow:hidden}img{width:100%;height:220px;object-fit:contain;background:repeating-conic-gradient(#17223c 0% 25%,#283550 0% 50%) 0/24px 24px;image-rendering:pixelated}a{color:#f5d891;text-decoration:none}small{color:#bac8df}button,input{padding:10px;background:#17223c;border:1px solid #d9a441;color:white;border-radius:6px;margin-bottom:18px}h2{margin-top:32px}</style>
<h1>던전 오브 소울 · 전투 이펙트</h1><p>폭발 3세트와 화염 장판의 프레임 재생 및 전체 PNG 원본 미리보기입니다. 이미지를 누르면 원본을 엽니다.</p><button id="toggle">재생 일시정지</button><section id="animations"></section><h2>전체 파일</h2><input id="search" placeholder="파일명 검색"><span id="count"></span><main id="grid"></main><script src="catalog_data.js"></script><script>
const sequences=[['q_fire_explosion','파이어볼 폭발',4,100],['e_meteor_explosion','메테오 착탄',4,120],['r_lightning_spark','낙뢰 착탄',4,80],['q_fire_ground','화염 장판',3,180]];
document.querySelector('#animations').innerHTML=sequences.map(([key,label])=>'<article><img id="'+key+'" alt="'+label+'"><p>'+label+'</p><small>원본 프레임 순차 재생</small></article>').join('');
let paused=false;document.querySelector('#toggle').onclick=()=>{paused=!paused;document.querySelector('#toggle').textContent=paused?'재생':'재생 일시정지'};
sequences.forEach(([key,label,n,ms])=>{let frame=1;const el=document.getElementById(key);const show=()=>el.src=key+'_'+String(frame).padStart(2,'0')+'.png';show();setInterval(()=>{if(!paused){frame=frame%n+1;show()}},ms)});
function render(){const q=document.querySelector('#search').value.toLowerCase();const rows=ASSETS.filter(x=>x.name.includes(q));document.querySelector('#count').textContent=' '+rows.length+'장';document.querySelector('#grid').innerHTML=rows.map(x=>'<article><a href="'+x.name+'" target="_blank"><img loading="lazy" src="'+x.name+'" alt="'+x.name+'"><p>'+x.name+'</p></a><small>'+x.width+' × '+x.height+' px</small></article>').join('')}document.querySelector('#search').oninput=render;render();
</script></html>
